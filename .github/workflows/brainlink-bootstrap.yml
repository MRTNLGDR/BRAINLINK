name: Brainlink full-source bootstrap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Brainlink bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check bootstrap sentinel
        id: gate
        shell: bash
        run: |
          if [[ -f .brainlink-bootstrap-complete ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Brainlink full-source bootstrap already completed."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild and verify Brainlink runtime overlay
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/brainlink/overlay
          cp .github/workflows/brainlink-bootstrap.yml /tmp/brainlink-bootstrap.yml
          cat .brainlink-seed/runtime.part*.b64 | base64 --decode > /tmp/brainlink/runtime.tar.gz
          echo "1b4e3aa98dd378eb7299e071aa83329643114e40b3e66a378c319613a2a94b8d  /tmp/brainlink/runtime.tar.gz" | sha256sum -c -
          tar -xzf /tmp/brainlink/runtime.tar.gz -C /tmp/brainlink/overlay

      - name: Import AFFiNE v0.27.0 and apply Brainlink
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.27.0 https://github.com/toeverything/AFFiNE.git /tmp/brainlink/affine
          UPSTREAM_SHA="$(git -C /tmp/brainlink/affine rev-parse HEAD)"

          rsync -a --delete --exclude='.git' /tmp/brainlink/affine/ ./
          rsync -a /tmp/brainlink/overlay/ ./

          mkdir -p .github/workflows docs/evidence
          cp /tmp/brainlink-bootstrap.yml .github/workflows/brainlink-bootstrap.yml
          touch .brainlink-bootstrap-complete
          cat > docs/evidence/UPSTREAM_IMPORT_2026-08-08.txt <<EOF
          Brainlink upstream import
          source=https://github.com/toeverything/AFFiNE
          tag=v0.27.0
          commit=${UPSTREAM_SHA}
          runtime_overlay_sha256=1b4e3aa98dd378eb7299e071aa83329643114e40b3e66a378c319613a2a94b8d
          uploaded_affine_zip_sha256=f65b6967dbf2992a4d39f51ddc48fdac04828a47d01599a53ca48cbd0e3b3f47
          EOF

      - name: Commit full Brainlink source
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import AFFiNE 0.27.0 and Brainlink governed runtime [brainlink-full-import]"
          git push origin HEAD:main
